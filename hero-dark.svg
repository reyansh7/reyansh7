<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D0D0D"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="redFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#EF4444" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- left accent bar -->
  <rect x="0" y="0" width="6" height="320" fill="#EF4444"/>

  <!-- decorative corner brackets, engineering-schematic feel -->
  <path d="M 1120 40 L 1160 40 L 1160 80" fill="none" stroke="#B91C1C" stroke-width="2"/>
  <path d="M 1120 280 L 1160 280 L 1160 240" fill="none" stroke="#B91C1C" stroke-width="2"/>
  <circle cx="1160" cy="40" r="3" fill="#EF4444"/>
  <circle cx="1160" cy="280" r="3" fill="#EF4444"/>

  <!-- kicker -->
  <text x="70" y="90" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="15" letter-spacing="4" fill="#EF4444">// SOFTWARE &amp; SYSTEMS ENGINEER</text>

  <!-- name -->
  <text x="68" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF">REYANSH IYER</text>

  <!-- underline accent -->
  <rect x="70" y="180" width="360" height="4" fill="url(#redFade)"/>

  <!-- role line -->
  <text x="70" y="222" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="17" letter-spacing="2" fill="#D4D4D4">AI SYSTEMS <tspan fill="#EF4444">·</tspan> SOFTWARE ENGINEERING <tspan fill="#EF4444">·</tspan> CYBERSECURITY <tspan fill="#EF4444">·</tspan> CLOUD</text>

  <!-- tagline -->
  <text x="70" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#9CA3AF">Building intelligent systems, developer tools &amp; scalable infrastructure.</text>

  <!-- terminal cursor blink -->
  <rect x="70" y="272" width="12" height="18" fill="#EF4444">
    <animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>
</svg>
