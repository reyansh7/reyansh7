name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: reyansh7
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#B91C1C&color_dots=#ebedf0,#FECACA,#F87171,#DC2626,#B91C1C
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FECACA&color_dots=#161b22,#4A1515,#7F1D1D,#B91C1C,#EF4444

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
